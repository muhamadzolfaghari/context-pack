name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  test-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release candidate
        run: |
          npm run check
          npm test
          npm run test:coverage
          npm run verify:package
          npm pack --dry-run

      - name: Check npm publication state
        id: npm
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping publish and validating registry."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is not published yet."
          fi

      - name: Publish to npm with OIDC trusted publishing
        if: steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Post-Publish Registry Validation Smoke Test
        shell: bash
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "Waiting for $NAME@$VERSION to become visible on npm..."
          registry_ready=false
          for attempt in {1..30}; do
            if npm view "${NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; then
              registry_ready=true
              echo "✅ npm registry verified"
              break
            fi
            echo "Registry not ready yet (attempt ${attempt}/30)"
            sleep 10
          done
          if [ "${registry_ready}" != "true" ]; then
            echo "::error::${NAME}@${VERSION} did not become visible on npm within the validation window"
            exit 1
          fi

          echo "Testing CLI execution via npx..."
          npx --yes "${NAME}@${VERSION}" --help
          npx --yes "${NAME}@${VERSION}" --version

          echo "Testing ES module library import..."
          node --input-type=module -e "import { buildSmartPack } from '${NAME}'; if (typeof buildSmartPack !== 'function') throw new Error('Missing buildSmartPack export');"

          echo "🎉 Post-publish registry and CLI smoke test passed"
